{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block extra_css %}
<style>
  body, html { margin: 0; padding: 0; }
  .login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1028 0%, #2d1b4e 30%, #3d2660 50%, #2d1b4e 70%, #1a1028 100%);
    position: relative; overflow: hidden;
  }
  .login-page::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(120,80,180,0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(80,60,140,0.1) 0%, transparent 50%);
  }

  .login-card {
    width: 420px; max-width: 90vw; position: relative; z-index: 2;
  }

  /* Avatar circle */
  .avatar-circle {
    width: 90px; height: 90px; border-radius: 50%;
    background: #1e1233; border: 3px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto -45px; position: relative; z-index: 3;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .avatar-circle i { font-size: 36px; color: rgba(255,255,255,0.7); }

  /* Glass card */
  .glass-box {
    background: rgba(120, 80, 170, 0.25);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 60px 36px 36px; 
    box-shadow: 0 25px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  /* Input rows */
  .input-row {
    display: flex; align-items: center; background: rgba(255,255,255,0.9);
    border-radius: 4px; margin-bottom: 14px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.3);
    transition: box-shadow 0.3s;
  }
  .input-row:focus-within {
    box-shadow: 0 0 0 2px rgba(120,80,200,0.5);
    background: #fff;
  }
  .input-icon {
    width: 46px; min-width: 46px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(100,70,160,0.15); color: #5b3a8c; font-size: 16px;
    border-right: 1px solid rgba(100,70,160,0.15);
  }
  .input-row input {
    flex: 1; border: none; outline: none; background: transparent;
    padding: 12px 14px; font-size: 14px; color: #1e1233;
    font-family: 'Inter', sans-serif;
  }
  .input-row input::placeholder { color: #9a8bb5; }
  .input-row .toggle-pwd {
    background: none; border: none; cursor: pointer; padding: 0 14px;
    color: #7c6a9c; font-size: 16px;
  }

  /* Remember / forgot row */
  .options-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; font-size: 13px;
  }
  .options-row label { color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .options-row label input[type="checkbox"] { accent-color: #7c4dff; width: 15px; height: 15px; }
  .options-row a { color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.2s; }
  .options-row a:hover { color: #fff; }

  /* Login button */
  .login-btn {
    width: 100%; padding: 14px; border: none; border-radius: 4px; cursor: pointer;
    background: #1e1233; color: #fff; font-size: 15px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase; font-family: 'Inter', sans-serif;
    transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .login-btn:hover { background: #2a1a45; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .login-btn:active { transform: translateY(0); }
  .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  /* Extras below card */
  .bottom-links {
    text-align: center; margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.5);
  }
  .bottom-links a { color: rgba(200,170,255,0.8); font-weight: 600; text-decoration: none; transition: color 0.2s; }
  .bottom-links a:hover { color: #fff; }
  .demo-badge {
    display: inline-block; margin-top: 12px; padding: 6px 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; font-size: 11px; color: rgba(255,255,255,0.5);
  }
  .demo-badge code { color: rgba(200,170,255,0.9); }

  /* Alert */
  .alert-error {
    background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5; padding: 10px 14px; border-radius: 6px; font-size: 13px;
    margin-bottom: 14px; text-align: center;
  }

  /* Spinner */
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block body %}
<div class="login-page">
  <div class="login-card">
    
    <!-- Avatar -->
    <div class="avatar-circle">
      <i class="bi bi-person"></i>
    </div>

    <!-- Glass Card -->
    <div class="glass-box">
      <div id="alert-box"></div>

      <form id="loginForm">
        <!-- Email -->
        <div class="input-row">
          <div class="input-icon"><i class="bi bi-person-fill"></i></div>
          <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
        </div>

        <!-- Password -->
        <div class="input-row">
          <div class="input-icon"><i class="bi bi-lock-fill"></i></div>
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePwd()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <!-- Remember / Forgot -->
        <div class="options-row">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" id="loginBtn" class="login-btn">
          <span id="btnText">LOGIN</span>
          <svg id="btnSpinner" class="spinner" style="display:none;" width="20" height="20" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle opacity="0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path opacity="0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>
      </form>
    </div>

    <!-- Bottom links -->
    <div class="bottom-links">
      Don't have an account? <a href="/register">Create one free</a>
      <br>
      <div class="demo-badge">
        Demo: <code>admin@mockexam.com / Admin@123</code>
      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePwd() {
  const p = document.getElementById('password');
  const e = document.getElementById('eyeIcon');
  p.type = p.type === 'password' ? 'text' : 'password';
  e.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const txt = document.getElementById('btnText');
  const sp = document.getElementById('btnSpinner');
  
  btn.disabled = true;
  txt.textContent = 'SIGNING IN...';
  sp.style.display = 'block';
  
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    
    const data = await res.json();
    if(res.ok) {
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location = data.user.role === 'admin' ? '/admin-panel' : '/dashboard';
    } else {
      document.getElementById('alert-box').innerHTML = `
        <div class="alert-error">${data.detail || 'Login failed'}</div>`;
    }
  } catch (err) {
    document.getElementById('alert-box').innerHTML = `
      <div class="alert-error">Network error. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    txt.textContent = 'LOGIN';
    sp.style.display = 'none';
  }
});
</script>
{% endblock %}
